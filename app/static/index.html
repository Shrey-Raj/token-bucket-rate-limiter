<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Rate Limiter Demo</title>
<style>
  :root {
    --bg: #05060f;
    --panel: rgba(20, 22, 40, .6);
    --border: rgba(148, 163, 255, .16);
    --fg: #e8eaff;
    --muted: #8b90b8;
    --cyan: #22d3ee;
    --violet: #a78bfa;
    --good: #34d399;
    --warn: #fbbf24;
    --bad: #fb7185;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(167, 139, 250, .22), transparent 60%),
      radial-gradient(800px 500px at -10% 10%, rgba(34, 211, 238, .16), transparent 60%),
      var(--bg);
  }
  /* faint grid overlay */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(148, 163, 255, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 255, .05) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
  }

  main { position: relative; max-width: 680px; margin: 0 auto; padding: 28px 16px 56px; }

  /* ---------- Header ---------- */
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .eyebrow {
    font: 600 .72rem/1 var(--mono);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--cyan);
  }
  h1 {
    margin: 8px 0 6px;
    font-size: 1.9rem;
    line-height: 1.15;
    letter-spacing: -.02em;
    background: linear-gradient(90deg, #fff, var(--cyan) 60%, var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { margin: 0; color: var(--muted); font-size: .95rem; }

  .github {
    flex-shrink: 0;
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    color: var(--fg);
    background: var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    transition: transform .2s, box-shadow .2s, border-color .2s;
  }
  .github:hover {
    transform: translateY(-2px);
    border-color: var(--cyan);
    box-shadow: 0 0 22px rgba(34, 211, 238, .35);
  }
  .github svg { width: 22px; height: 22px; fill: currentColor; }

  /* ---------- Panels ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin: 18px 0;
    backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
  }
  .panel-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 0 0 14px;
    font: 600 .72rem/1 var(--mono);
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- Gauge ---------- */
  .gauge { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .ring { position: relative; width: 170px; height: 170px; flex-shrink: 0; --c: var(--good); }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 12; stroke-linecap: round; }
  .ring .bg { stroke: rgba(148, 163, 255, .12); }
  .ring .fg {
    stroke: var(--c);
    stroke-dasharray: 439.82;
    stroke-dashoffset: 439.82;
    filter: drop-shadow(0 0 8px var(--c));
    transition: stroke-dashoffset .12s linear, stroke .3s;
  }
  .ring .center {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    text-align: center;
  }
  #tokenNumber { font: 700 2.6rem/1 var(--mono); }
  .ring small { color: var(--muted); font: .78rem var(--mono); }

  .gauge-info { flex: 1; min-width: 200px; }
  #state {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font: 600 .78rem var(--mono);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--c, var(--good));
    border: 1px solid currentColor;
    background: rgba(255, 255, 255, .03);
  }
  .hint { margin: 12px 0 0; color: var(--muted); font-size: .88rem; }
  #retry { min-height: 1.5em; margin-top: 8px; font: .9rem var(--mono); color: var(--bad); }

  /* ---------- Buttons ---------- */
  .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: 12px;
    border: 1px solid transparent;
    color: #04121a;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    cursor: pointer;
    transition: transform .15s, box-shadow .2s, opacity .2s;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(34, 211, 238, .3); }
  button.ghost {
    color: var(--fg);
    background: rgba(255, 255, 255, .04);
    border-color: var(--border);
  }
  button.ghost:hover:not(:disabled) { border-color: var(--violet); box-shadow: 0 8px 28px rgba(167, 139, 250, .25); }
  button:disabled { opacity: .45; cursor: wait; }
  #note { min-height: 1.4em; margin-top: 10px; color: var(--muted); font-size: .88rem; }

  /* ---------- Stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat {
    padding: 14px 8px;
    text-align: center;
    border-radius: 14px;
    background: rgba(255, 255, 255, .03);
    border: 1px solid var(--border);
  }
  .stat b { display: block; font: 700 1.7rem/1.2 var(--mono); }
  .stat span { color: var(--muted); font: .72rem var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .good { color: var(--good); }
  .bad  { color: var(--bad); }
  .cyan { color: var(--cyan); }

  /* ---------- Log ---------- */
  #clear {
    padding: 4px 10px;
    font: 600 .7rem var(--mono);
    letter-spacing: .1em;
    text-transform: uppercase;
    border-radius: 8px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
  }
  #clear:hover { color: var(--fg); transform: none; box-shadow: none; border-color: var(--muted); }

  #log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  #log:empty::before {
    content: "No requests yet. Send one to see it here.";
    padding: 18px;
    text-align: center;
    color: var(--muted);
    font: .85rem var(--mono);
    border: 1px dashed var(--border);
    border-radius: 12px;
  }

  .entry {
    --c: var(--good);
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(255, 255, 255, .03);
    border: 1px solid var(--border);
    border-left: 3px solid var(--c);
    animation: slideIn .25s ease-out;
  }
  .entry.bad { --c: var(--bad); }
  .entry.burst { --c: var(--violet); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .badge {
    min-width: 52px;
    padding: 4px 8px;
    text-align: center;
    font: 700 .85rem var(--mono);
    border-radius: 8px;
    color: var(--c);
    background: color-mix(in srgb, var(--c) 14%, transparent);
  }
  .title { font-weight: 600; font-size: .95rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip {
    padding: 1px 8px;
    font: .75rem/1.6 var(--mono);
    color: var(--muted);
    border-radius: 6px;
    background: rgba(148, 163, 255, .08);
  }
  .chip.good { color: var(--good); }
  .chip.bad  { color: var(--bad); }
  .time { font: .72rem var(--mono); color: var(--muted); align-self: start; }

  .split { display: flex; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; background: rgba(148, 163, 255, .12); }
  .split i { display: block; height: 100%; }
  .split .a { background: var(--good); }
  .split .r { background: var(--bad); }
  .footnote { margin-top: 6px; font-size: .74rem; color: var(--muted); }
</style>
</head>
<body>
<main>

  <header>
    <div>
      <div class="eyebrow">Live demo</div>
      <h1>Token Bucket Rate Limiter</h1>
      <p class="subtitle" id="rules"></p>
    </div>
    <a class="github" href="https://github.com/Shrey-Raj/token-bucket-rate-limiter"
       target="_blank" rel="noopener noreferrer" aria-label="View source on GitHub" title="View source on GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </header>

  <section class="panel">
    <h2 class="panel-title">Your bucket</h2>
    <div class="gauge">
      <div class="ring" id="ring">
        <svg viewBox="0 0 160 160" aria-hidden="true">
          <circle class="bg" cx="80" cy="80" r="70"></circle>
          <circle class="fg" id="ringFg" cx="80" cy="80" r="70"></circle>
        </svg>
        <div class="center">
          <span id="tokenNumber">--</span>
          <small id="tokenMax"></small>
        </div>
      </div>
      <div class="gauge-info">
        <span id="state">Idle</span>
        <div id="retry"></div>
        <p class="hint">You are identified by your IP address, so other visitors do not affect your bucket.</p>
      </div>
    </div>
  </section>

  <div class="actions">
    <button id="sendOne">Send 1 request</button>
    <button id="sendBurst" class="ghost">Send burst of 150</button>
  </div>
  <div id="note" aria-live="polite"></div>

  <section class="panel stats">
    <div class="stat"><b id="allowedCount" class="good">0</b><span>Allowed</span></div>
    <div class="stat"><b id="rejectedCount" class="bad">0</b><span>Rejected</span></div>
    <div class="stat"><b id="totalCount" class="cyan">0</b><span>Total</span></div>
  </section>

  <section class="panel">
    <h2 class="panel-title">
      <span>Request log</span>
      <button id="clear" type="button">Clear</button>
    </h2>
    <ul id="log" aria-live="polite"></ul>
  </section>

</main>

<script>
  // ---------- Config (the server fills in the two placeholders) ----------
  const CAPACITY       = Number("__CAPACITY__") || 100;  // max tokens in the bucket
  const REFILL_PER_SEC = Number("__REFILL__")   || 10;   // tokens added per second
  const BURST_SIZE     = 150;                            // requests sent by the burst button
  const MAX_LOG_LINES  = 15;
  const RING_LENGTH    = 439.82;                         // circumference of the gauge ring (r = 70)

  // ---------- State ----------
  let tokens = null;        // last token count reported by the server
  let tokensAt = 0;         // when we learned it (ms, performance.now)
  let retryUntil = 0;       // when a 429 says we may try again
  let requestNumber = 0;
  let allowed = 0;
  let rejected = 0;

  const $ = (id) => document.getElementById(id);

  // ---------- Bucket display ----------
  // The server only reports the count at the time of each response,
  // so we estimate the current level by adding the tokens refilled since then.
  function estimateTokens() {
    if (tokens === null) return null;
    const secondsPassed = (performance.now() - tokensAt) / 1000;
    return Math.min(CAPACITY, tokens + secondsPassed * REFILL_PER_SEC);
  }

  function render() {
    const now = performance.now();
    const est = estimateTokens();
    const waitSeconds = Math.ceil((retryUntil - now) / 1000);

    if (est === null) {
      $("tokenNumber").textContent = "--";
      $("ringFg").style.strokeDashoffset = RING_LENGTH;
      $("state").textContent = "Idle";
      $("ring").style.setProperty("--c", "var(--cyan)");
    } else {
      const pct = est / CAPACITY;
      const color = pct > 0.5 ? "var(--good)" : pct > 0.2 ? "var(--warn)" : "var(--bad)";
      $("tokenNumber").textContent = Math.floor(est);
      $("ringFg").style.strokeDashoffset = RING_LENGTH * (1 - pct);
      $("ring").style.setProperty("--c", color);
      $("state").textContent = pct > 0.5 ? "Healthy" : pct > 0.2 ? "Running low" : "Nearly empty";
    }

    $("state").style.setProperty("--c", getComputedStyle($("ring")).getPropertyValue("--c"));
    $("retry").textContent = waitSeconds > 0 ? `Rate limited. Retry in ${waitSeconds}s` : "";
  }
  setInterval(render, 100);

  // ---------- One request to the API ----------
  async function sendRequest() {
    const start = performance.now();
    // Free hosting can be asleep; tell the user why the first call is slow.
    const wakeTimer = setTimeout(() => {
      $("note").textContent = "The free server is waking up. This can take up to a minute...";
    }, 4000);

    try {
      const res = await fetch("/v1/check", { cache: "no-store" });
      const remaining  = parseInt(res.headers.get("X-RateLimit-Remaining"), 10);
      const retryAfter = parseInt(res.headers.get("Retry-After"), 10);
      return {
        status: res.status,
        remaining: Number.isNaN(remaining) ? null : remaining,
        retryAfter: Number.isNaN(retryAfter) ? null : retryAfter,
        ms: Math.round(performance.now() - start),
        at: performance.now(),
      };
    } catch (err) {
      return { status: 0, remaining: null, retryAfter: null, ms: Math.round(performance.now() - start), at: performance.now() };
    } finally {
      clearTimeout(wakeTimer);
      $("note").textContent = "";
    }
  }

  // Update bucket, counters and retry timer from one response.
  function recordResult(r) {
    if (r.remaining !== null) {
      tokens = r.remaining;
      tokensAt = r.at;
    }
    if (r.status === 429 && r.retryAfter) {
      retryUntil = Math.max(retryUntil, r.at + r.retryAfter * 1000);
    }
    if (r.status === 200) allowed++;
    else if (r.status === 429) rejected++;

    $("allowedCount").textContent = allowed;
    $("rejectedCount").textContent = rejected;
    $("totalCount").textContent = allowed + rejected;
  }

  // ---------- Log ----------
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function chip(text, cls = "") {
    return el("span", "chip " + cls, text);
  }

  function clock() {
    return new Date().toLocaleTimeString([], { hour12: false });
  }

  // Builds one log card: [badge] [title + chips (+ extra)] [time]
  function addLog({ kind, badge, title, chips, extra }) {
    const li = el("li", "entry " + kind);
    const body = el("div", "body");

    body.append(el("div", "title", title));
    const chipRow = el("div", "chips");
    chips.forEach((c) => chipRow.append(c));
    body.append(chipRow);
    if (extra) body.append(extra);

    li.append(el("span", "badge", badge), body, el("span", "time", clock()));

    $("log").prepend(li);
    while ($("log").children.length > MAX_LOG_LINES) $("log").lastChild.remove();
  }

  function describe(status) {
    if (status === 200) return { label: "Allowed", kind: "good" };
    if (status === 429) return { label: "Rate limited", kind: "bad" };
    if (status === 503) return { label: "Limiter unavailable", kind: "bad" };
    return { label: "Network error", kind: "bad" };
  }

  function setBusy(busy) {
    $("sendOne").disabled = busy;
    $("sendBurst").disabled = busy;
  }

  // ---------- Buttons ----------
  $("sendOne").onclick = async () => {
    setBusy(true);
    const r = await sendRequest();
    recordResult(r);

    const { label, kind } = describe(r.status);
    const chips = [];
    if (r.remaining !== null) chips.push(chip(`${r.remaining} tokens left`));
    if (r.status === 429 && r.retryAfter) chips.push(chip(`retry in ${r.retryAfter}s`, "bad"));
    chips.push(chip(`${r.ms} ms`));

    addLog({
      kind,
      badge: r.status || "ERR",
      title: `Request #${++requestNumber} \u00b7 ${label}`,
      chips,
    });

    setBusy(false);
  };

  $("sendBurst").onclick = async () => {
    setBusy(true);
    const startTokens = estimateTokens();
    const start = performance.now();

    const results = await Promise.all(Array.from({ length: BURST_SIZE }, sendRequest));
    const seconds = (performance.now() - start) / 1000;
    results.forEach(recordResult);

    // The lowest "remaining" value is the most accurate picture of the bucket afterwards.
    const lowest = results
      .filter((r) => r.remaining !== null)
      .sort((a, b) => a.remaining - b.remaining)[0];
    if (lowest) {
      tokens = lowest.remaining;
      tokensAt = lowest.at;
    }

    const ok = results.filter((r) => r.status === 200).length;
    const blocked = results.filter((r) => r.status === 429).length;
    // Most that could pass: tokens we started with + tokens refilled while the burst ran.
    const maxPossible = Math.round((startTokens ?? CAPACITY) + REFILL_PER_SEC * seconds);

    // Green/red split bar showing the share of allowed vs rejected requests.
    const split = el("div", "split");
    const a = el("i", "a"); a.style.width = (ok / BURST_SIZE) * 100 + "%";
    const r = el("i", "r"); r.style.width = (blocked / BURST_SIZE) * 100 + "%";
    split.append(a, r);

    const note = el("div", "footnote",
      `At most about ${maxPossible} can pass: starting tokens + ${REFILL_PER_SEC}/s \u00d7 time.`);
    const extra = el("div");
    extra.append(split, note);

    addLog({
      kind: "burst",
      badge: `\u00d7${BURST_SIZE}`,
      title: `Burst \u00b7 ${BURST_SIZE} requests in ${seconds.toFixed(1)}s`,
      chips: [chip(`${ok} allowed`, "good"), chip(`${blocked} rejected`, "bad")],
      extra,
    });

    setBusy(false);
  };

  $("clear").onclick = () => { $("log").replaceChildren(); };

  // ---------- Intro text ----------
  $("rules").textContent =
    `Holds up to ${CAPACITY} tokens and refills ${REFILL_PER_SEC} per second. ` +
    `Each request costs 1 token. When it is empty, requests are rejected (429).`;
  $("tokenMax").textContent = `of ${CAPACITY} tokens`;
</script>
</body>
</html>
